[project]
name = "reckonsolve"
version = "0.1.0"
description = "A local-first personal forecasting journal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyside6>=6.11.1",
]

[project.scripts]
reckonsolve = "reckonsolve:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.2",
]
